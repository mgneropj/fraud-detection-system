services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: fraud-detection-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
